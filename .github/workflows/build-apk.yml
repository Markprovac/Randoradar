name: Build Rando Radar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: randoradar-debug-keystore-v1

      - name: Install dependencies
        run: npm install

      - name: Bundle Leaflet inside the APK
        run: npm run copy:leaflet

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Configure Android permissions and version
        run: npm run android:patch

      - name: Generate Rando Radar icon and splash assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#f4f7f6' --splashBackgroundColor '#f4f7f6'

      - name: Build standalone APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RandoRadar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RandoRadar-APK
          path: RandoRadar.apk
          if-no-files-found: error
